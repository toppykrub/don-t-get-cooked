<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f1117" />

  <title>Don't Get Cooked! ($WRC) — v11</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #0f1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      background: #1a1d26;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border: 1px solid #2a2e3d;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 10px;
    }

    .title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ff9800;
    }

    .badge {
      background: #ff980020;
      color: #ff9800;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #ff980040;
      white-space: nowrap;
    }

    /* ROUND TIMER */

    .round-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12141c;
      border: 1px solid #252936;
      border-radius: 12px;
      padding: 9px 12px;
      margin-bottom: 12px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .round-label {
      color: #8890a6;
    }

    .round-time {
      color: #00e676;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
    }

    .round-time.warning {
      color: #ff9800;
    }

    .round-time.danger {
      color: #f44336;
    }

    .game-screen {
      --heat: 0;

      background:
        radial-gradient(
          ellipse at 50% 100%,
          rgba(255, 105, 0, calc(var(--heat) * .22)) 0%,
          transparent 58%
        ),
        #12141c;

      border-radius: 16px;
      height: 220px;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      position: relative;
      overflow: hidden;

      border: 1px solid #252936;
      margin-bottom: 16px;

      isolation: isolate;

      transition:
        background-color .3s,
        border-color .3s;
    }

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    /* FIRE */

    .flame-bed {
      position: absolute;
      left: 50%;
      bottom: 30px;
      width: 190px;
      height: 115px;
      transform: translateX(-50%);

      opacity: calc(.16 + var(--heat) * .84);
      filter: blur(calc(2px + var(--heat) * 2px));

      transition: opacity .25s;
    }

    .flame {
      --delay: 0s;

      position: absolute;
      bottom: 0;
      left: 50%;

      width: 38px;
      height: 76px;

      transform-origin: 50% 100%;

      border-radius:
        55% 45% 48% 52% /
        70% 70% 30% 30%;

      background:
        linear-gradient(
          to top,
          #ff3d00 4%,
          #ff7900 48%,
          #ffd54f 88%,
          transparent
        );

      box-shadow: 0 0 18px #ff6d00aa;

      animation:
        flameDance .62s ease-in-out infinite alternate;

      animation-delay: var(--delay);
    }

    .flame:nth-child(1) {
      margin-left: -68px;
      height: 59px;
      width: 30px;
    }

    .flame:nth-child(2) {
      margin-left: -42px;
      height: 92px;
      width: 37px;
      --delay: -.18s;
    }

    .flame:nth-child(3) {
      margin-left: -15px;
      height: 67px;
      width: 35px;
      --delay: -.39s;
    }

    .flame:nth-child(4) {
      margin-left: 13px;
      height: 99px;
      width: 41px;
      --delay: -.1s;
    }

    .flame:nth-child(5) {
      margin-left: 42px;
      height: 65px;
      width: 32px;
      --delay: -.31s;
    }

    .flame:nth-child(6) {
      margin-left: 62px;
      height: 48px;
      width: 26px;
      --delay: -.48s;
    }

    @keyframes flameDance {
      from {
        transform:
          rotate(-9deg)
          scaleY(.78)
          translateY(5px);
      }

      to {
        transform:
          rotate(9deg)
          scaleY(1.12)
          translateY(-3px);
      }
    }

    /* PAN */

    .pan {
      position: absolute;
      left: 50%;
      bottom: 25px;

      width: 202px;
      height: 76px;

      transform: translateX(-50%);

      z-index: 2;
    }

    .pan-handle {
      position: absolute;
      right: -56px;
      top: 22px;

      width: 76px;
      height: 15px;

      border-radius: 12px;

      background:
        linear-gradient(#81502d, #4d2b1c);

      border: 2px solid #b9793d;

      transform: rotate(-6deg);
      transform-origin: left center;
    }

    .pan-rim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      height: 46px;

      border-radius:
        0 0 50% 50% /
        0 0 70% 70%;

      background:
        linear-gradient(
          160deg,
          #e1a362 0%,
          #a95d31 30%,
          #64351f 73%,
          #311d18 100%
        );

      border: 3px solid #d18a4e;

      box-shadow:
        0 8px 20px #0009,
        inset 0 -7px 10px #24130e;
    }

    .pan-rim::before {
      content: "";

      position: absolute;
      left: -3px;
      right: -3px;
      top: -10px;

      height: 22px;

      border-radius: 50%;

      background:
        linear-gradient(
          180deg,
          #efb878,
          #8b4c2c
        );

      border: 3px solid #d18a4e;

      box-shadow:
        inset 0 3px 5px #ffd18a55;
    }

    .soup {
      position: absolute;

      z-index: 1;

      left: 12px;
      right: 12px;
      bottom: 30px;

      height: 24px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          #713310 0%,
          #351d13 70%
        );

      overflow: hidden;
    }

    .bubble {
      position: absolute;

      bottom: 3px;
      left: var(--x);

      width: var(--size);
      height: var(--size);

      border: 2px solid #ffb64d99;

      border-radius: 50%;

      background: #ff8f0033;

      animation:
        bubbleRise var(--duration)
        ease-in infinite;

      animation-delay: var(--delay);

      opacity: .85;
    }

    @keyframes bubbleRise {
      0% {
        transform:
          translateY(2px)
          scale(.5);
        opacity: 0;
      }

      25% {
        opacity: .85;
      }

      100% {
        transform:
          translateY(-52px)
          scale(1.25);
        opacity: 0;
      }
    }

    /* CHEF */

    .chef {
      position: absolute;

      z-index: 3;

      left: 50%;
      bottom: 67px;

      width: 92px;
      height: 112px;

      transform: translateX(-50%);
      transform-origin: 50% 100%;

      transition:
        filter .3s,
        transform .3s;

      animation:
        chefBob 1.7s ease-in-out infinite;
    }

    .chef svg {
      display: block;

      width: 100%;
      height: 100%;

      overflow: visible;

      filter:
        drop-shadow(0 5px 4px #0008);
    }

    @keyframes chefBob {
      0%, 100% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(-1deg);
      }

      50% {
        transform:
          translateX(-50%)
          translateY(-4px)
          rotate(1deg);
      }
    }

    /* SMOKE */

    .smoke {
      position: absolute;

      z-index: 4;

      left: 50%;
      bottom: 132px;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background: #cbd0d755;

      filter: blur(3px);

      opacity: 0;

      animation:
        smokeRise 2.6s ease-out infinite;
    }

    .smoke.s2 {
      margin-left: 18px;
      animation-delay: .9s;
    }

    .smoke.s3 {
      margin-left: -24px;
      animation-delay: 1.7s;
    }

    @keyframes smokeRise {
      0% {
        transform:
          translateY(0)
          scale(.5);
        opacity: 0;
      }

      25% {
        opacity: .38;
      }

      100% {
        transform:
          translateY(-47px)
          scale(2.8);
        opacity: 0;
      }
    }

    /* MULTIPLIER */

    .multiplier {
      position: relative;
      z-index: 5;

      font-size: 3.5rem;
      line-height: 1;

      font-weight: 900;

      color: #00e676;

      text-shadow:
        0 0 20px rgba(0, 230, 118, 0.3);

      transition:
        color .2s,
        text-shadow .2s;

      margin-bottom: 4px;
    }

    .multiplier.crashed {
      color: #f44336;

      text-shadow:
        0 0 20px rgba(244, 67, 54, 0.55);
    }

    .status {
      position: relative;
      z-index: 5;

      font-size: .9rem;

      color: #c1c5d2;

      margin:
        0 8px
        13px;

      font-weight: 600;

      text-align: center;

      text-shadow:
        0 2px 5px #000;
    }

    /* RUNNING */

    .game-screen.running .chef {
      animation-duration:
        calc(1.7s - var(--heat) * .85s);
    }

    .game-screen.running .pan {
      animation:
        panShake
        calc(.7s - var(--heat) * .3s)
        ease-in-out
        infinite alternate;
    }

    @keyframes panShake {
      from {
        transform:
          translateX(-50%)
          rotate(-1deg);
      }

      to {
        transform:
          translateX(-50%)
          rotate(1deg);
      }
    }

    /* COOKED */

    .game-screen.cooked {
      background:
        radial-gradient(
          ellipse at 50% 80%,
          #78251e99,
          transparent 68%
        ),
        #12141c;

      border-color: #8a3029;
    }

    .game-screen.cooked .chef {
      animation:
        cookedDrop .5s ease-out forwards;

      filter:
        grayscale(.72)
        sepia(.55)
        brightness(.58);
    }

    .game-screen.cooked .flame-bed {
      opacity: 1;
      filter: blur(1px);
    }

    .game-screen.cooked .smoke {
      opacity: .65;
    }

    @keyframes cookedDrop {
      0% {
        transform:
          translateX(-50%)
          translateY(-2px)
          rotate(0);
      }

      35% {
        transform:
          translateX(-50%)
          translateY(3px)
          rotate(10deg);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(7px)
          rotate(-8deg);
      }
    }

    /* ESCAPED */

    .game-screen.escaped {
      background:
        radial-gradient(
          ellipse at 50% 50%,
          #c9821e55,
          transparent 67%
        ),
        #12141c;

      border-color: #b07a2b;
    }

    .game-screen.escaped .chef {
      animation:
        escapeJump
        .72s
        cubic-bezier(.2,.8,.3,1.2)
        forwards;

      filter:
        drop-shadow(0 0 12px #ffd54f);
    }

    .game-screen.escaped .flame-bed {
      opacity: .25;
    }

    @keyframes escapeJump {
      0% {
        transform:
          translateX(-50%)
          translateY(0)
          rotate(0);
      }

      55% {
        transform:
          translateX(-50%)
          translateY(-56px)
          rotate(-12deg);
      }

      100% {
        transform:
          translateX(-50%)
          translateY(-45px)
          rotate(8deg);
      }
    }

    /* HISTORY */

    .history {
      display: flex;

      gap: 6px;

      overflow-x: auto;

      margin-bottom: 16px;

      padding-bottom: 4px;
    }

    .history::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 4px 8px;

      border-radius: 8px;

      font-size: .75rem;

      font-weight: 700;

      background: #252936;

      white-space: nowrap;
    }

    .pill.win {
      color: #00e676;
    }

    .pill.loss {
      color: #f44336;
    }

    /* CONTROLS */

    .controls {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .input-row {
      display: flex;

      justify-content: space-between;
      align-items: center;

      background: #12141c;

      padding: 10px 14px;

      border-radius: 12px;

      border: 1px solid #252936;
    }

    .input-row span {
      color: #8890a6;

      font-size: .85rem;

      font-weight: 600;
    }

    .input-row input {
      background: transparent;

      border: none;

      color: #fff;

      font-size: 1rem;

      font-weight: 700;

      text-align: right;

      width: 100px;

      outline: none;
    }

    .input-row input:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* BUTTON */

    .btn {
      background: #00e676;

      color: #000;

      border: none;

      border-radius: 14px;

      padding: 16px;

      font-size: 1.1rem;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform .1s,
        background .2s;

      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn.cashout {
      background: #ff9800;
      color: #000;
    }

    /* LOCKED BUTTON */

    .btn:disabled,
    .btn.disabled {
      background: #3a3e4c;

      color: #777c8c;

      cursor: not-allowed;

      opacity: 1;

      transform: none;
    }

    .btn:disabled:active,
    .btn.disabled:active {
      transform: none;
    }

    .balance-box {
      display: flex;

      justify-content: space-between;

      margin-top: 14px;

      padding-top: 14px;

      border-top: 1px solid #252936;

      font-size: .85rem;

      color: #8890a6;
    }

    .balance-box strong {
      color: #fff;
    }

    @media (max-width: 400px) {
      .card {
        padding: 16px;
      }

      .multiplier {
        font-size: 3rem;
      }

      .btn {
        font-size: 1rem;
      }
    }


    .header { flex-wrap: wrap; }
    .header-actions { display:flex; align-items:center; gap:8px; }

    .leaderboard-trigger:hover { transform:translateY(-1px); border-color:#ffb74d; }

    @media(max-width:420px) { .header { gap:8px; } .title { font-size:1.05rem; } .header-actions { gap:5px; } .leaderboard-trigger { padding:7px 8px; font-size:.7rem; } .leaderboard-modal { padding:15px; } .leaderboard-tab { font-size:.7rem; } }

    .wallet-toast.show { opacity:1; transform:translate(-50%,0); }
    /* WINNING CASH-OUT EFFECT */
    .floating-cashout { position:absolute; z-index:10; left:50%; top:42%; max-width:calc(100% - 24px); padding:7px 12px; border:1px solid rgba(0,230,118,.48); border-radius:999px; background:rgba(8,24,17,.78); color:#00e676; font-size:clamp(1rem,5vw,1.45rem); line-height:1.2; font-weight:900; white-space:nowrap; pointer-events:none; text-align:center; text-shadow:0 0 8px #00e676,0 0 22px rgba(0,230,118,.8); box-shadow:0 0 24px rgba(0,230,118,.35); animation:cashoutFloat 1.35s cubic-bezier(.18,.72,.25,1) forwards; }
    @keyframes cashoutFloat { 0% { opacity:0; transform:translate(-50%,16px) scale(.68); } 14% { opacity:1; transform:translate(-50%,0) scale(1.12); } 28% { transform:translate(-50%,-4px) scale(1); } 100% { opacity:0; transform:translate(-50%,-76px) scale(.96); } }

    .floating-cashout.loss { color:#ff5252; border-color:rgba(255,82,82,.55); background:rgba(32,9,11,.82); text-shadow:0 0 8px #ff5252,0 0 22px rgba(255,82,82,.85); box-shadow:0 0 24px rgba(255,82,82,.38); }
    @media (max-width:360px) { .floating-cashout { padding:6px 9px; font-size:1rem; } }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

<button class="wallet-coming-soon" type="button" onclick="showWalletToast()">🔗 Connect Wallet (Coming Soon)</button>

<main class="card">

  /* =========================================
     AUDIO
  ========================================= */

  function ensureAudio() {

    if (isSoundMuted) return null;
    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioCtx) return null;

    if (!audioContext) {
      audioContext = new AudioCtx();
      masterGain = audioContext.createGain();
      masterGain.gain.value = isSoundMuted ? 0 : 1;
      masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
      audioContext.resume().catch(() => {});
    }

    return audioContext;
  }


  function playTone(
    frequency,
    duration,
    type,
    volume,
    endFrequency
  ) {
    if (isSoundMuted) return;


    const ctx = ensureAudio();

    if (!ctx) return;

    const now = ctx.currentTime;

    const oscillator =
      ctx.createOscillator();

    const gain =
      ctx.createGain();

    oscillator.type =
      type || "sine";

    oscillator.frequency
      .setValueAtTime(
        frequency,
        now
      );

    if (endFrequency) {

      oscillator.frequency
        .exponentialRampToValueAtTime(
          Math.max(1, endFrequency),
          now + duration
        );

    }

    gain.gain.setValueAtTime(
      0.0001,
      now
    );

    gain.gain.exponentialRampToValueAtTime(
      Math.max(.0002, volume),
      now + .012
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      now + duration
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);

    oscillator.stop(
      now + duration + .025
    );
  }

      gain.gain.setValueAtTime(.0001,onset); gain.gain.exponentialRampToValueAtTime(index===3?.085:.06,onset+.012); gain.gain.exponentialRampToValueAtTime(.0001,onset+duration);

  function startBoilSound() {

    filter.type =

    boilOscillator.connect(filter);

    filter.connect(boilGain);

    boilGain.connect(

    );

    boilOscillator.start();

    boilGain.gain.setTargetAtTime(
      .018,
      ctx.currentTime,
      .12
    );

    const now =

    const oscillator =

    const gain =

    boilOscillator = null;

    gain.gain.cancelScheduledValues(

     HISTORY
  ========================================= */

  function addHistory(
    value,
    isWin
  ) {

    const pill =
      document.createElement("div");

    pill.className =
      "pill " +
      (isWin ? "win" : "loss");

    pill.innerText =
      value.toFixed(2) + "x";

    historyEl.prepend(pill);

    if (
      historyEl.children.length > 10
    ) {

      historyEl.removeChild(
        historyEl.lastChild
      );

    }
  }


  /* =========================================
     HEAT
  ========================================= */

  function updateHeat(multiplier) {

    const heat =
      Math.max(
        0,
        Math.min(
          1,
          Math.log(
            Math.max(1, multiplier)
          ) /
          Math.log(13)
        )
      );

    screenEl.style.setProperty(
      "--heat",
      heat.toFixed(3)
    );
  }


  /* =========================================
     ROUND TIMER
  ========================================= */

  function updateRoundTimer() {

    roundTimerEl.innerText =
      roundRemaining;

    roundTimerEl.classList.remove(
      "warning",
      "danger"
    );

    if (roundRemaining <= 3) {

      roundTimerEl.classList.add(
        "danger"
      );

    } else if (
      roundRemaining <= 5
    ) {

      roundTimerEl.classList.add(
        "warning"
      );

    }
  }


  /* =========================================
     10 SECOND LOCK
  ========================================= */

  function startBettingPhase() {

    clearInterval(roundTimer);

    state = "LOCKED";

    roundRemaining =
      BETTING_TIME;

    roundLabelEl.innerText =
      "BETTING OPENS IN";

    updateRoundTimer();

    /*
     * IMPORTANT:
     * Bet amount can still be changed.
     * Only START GAME is locked.
     */

    betInput.disabled = false;

    btnEl.disabled = true;

    btnEl.className =
      "btn disabled";

    btnEl.innerText =
      "WAIT " +
      roundRemaining +
      "s";

    statusEl.innerText =
      "Get ready...";

    multEl.innerText =
      "1.00x";

    multEl.className =
      "multiplier";

    screenEl.classList.remove(
      "running",
      "cooked",
      "escaped"
    );

    screenEl.style.setProperty(
      "--heat",
      "0"
    );


    /*
     * COUNTDOWN
     */

    roundTimer =
      setInterval(() => {

        roundRemaining--;

        updateRoundTimer();

        /*
         * Still locked
         */

        if (
          roundRemaining > 0
        ) {

          btnEl.innerText =
            "WAIT " +
            roundRemaining +
            "s";

          return;
        }


        /*
         * 10 SECONDS FINISHED
         */

        clearInterval(roundTimer);

        roundTimer = null;

        state = "BETTING";

        roundLabelEl.innerText =
          "BETTING OPEN";

        roundTimerEl.innerText =
          "READY";

        roundTimerEl.classList.remove(
          "warning",
          "danger"
        );

        btnEl.disabled = false;

        btnEl.className =
          "btn";

        btnEl.innerText =
          "START GAME";

        statusEl.innerText =
          "Place your bet to start!";

      }, 1000);
  }


  /* =========================================
     START GAME
  ========================================= */

  function startGame() {

    /*
     * Cannot start unless betting
     * is officially open.
     */

    if (state !== "BETTING") {
      return;
    }

    bet =
      parseInt(
        betInput.value,
        10
      ) || 100;

    if (bet < 10) {

      statusEl.innerText =
        "Minimum bet is 10 $WRC!";

      return;
    }

    if (bet > balance) {

      statusEl.innerText =
        "Not enough balance!";

      return;
    }

    clearInterval(roundTimer);

    roundTimer = null;

    balance -= bet;
    const offlinePlayer = loadOfflinePlayer();
    offlinePlayer.totalVolume += bet;
    saveOfflinePlayer(offlinePlayer);
    syncPlayer(offlinePlayer);

    updateBalance();

    state = "RUNNING";

    currentMultiplier = 1.0;

    lastTickMultiplier = 1;

    multEl.className =
      "multiplier";

    multEl.innerText =
      "1.00x";

    screenEl.classList.remove(
      "cooked",
      "escaped"
    );

    screenEl.classList.add(
      "running"
    );

    screenEl.style.setProperty(
      "--heat",
      "0"
    );

    roundLabelEl.innerText =
      "ROUND TIME";

    roundRemaining =
      ROUND_TIME;

    updateRoundTimer();

    statusEl.innerText =
      "Cooking... Cash out before it burns!";

    btnEl.disabled = false;

    btnEl.innerText =
      "CASH OUT (" +
      (bet * currentMultiplier).toFixed(0) +
      " $WRC)";

    btnEl.className =
      "btn cashout";

    betInput.disabled = true;

    playStartSound();

    startBoilSound();


    /* CRASH POINT */

    const rand =
      Math.random();

    if (rand < 0.35) {

      crashPoint =
        1.0 +
        Math.random() * 0.8;

    } else if (rand < 0.75) {

      crashPoint =
        1.8 +
        Math.random() * 2.2;

    } else {

      crashPoint =
        4.0 +
        Math.random() * 8.0;

    }


    /* GAME TIMER */

    const startTime =
      Date.now();

    timer =
      setInterval(() => {

        const elapsed =
          (Date.now() - startTime) /
          1000;


        /* ROUND COUNTDOWN */

        roundRemaining =
          Math.max(
            0,
            ROUND_TIME -
            Math.floor(elapsed)
          );

        updateRoundTimer();


        /* MULTIPLIER */

        currentMultiplier =
          1.0 +
          Math.pow(
            elapsed * .9,
            1.8
          );

        updateHeat(
          currentMultiplier
        );

        updateBoilSound(
          currentMultiplier
        );


        /* TICK SOUND */

        if (
          currentMultiplier >=
          lastTickMultiplier + .18
        ) {

          playTick(
            currentMultiplier
          );

          lastTickMultiplier =
            currentMultiplier;

        }


        /* UI */

        multEl.innerText =
          currentMultiplier.toFixed(2) +
          "x";

        btnEl.innerText =
          "CASH OUT (" +
          (
            bet *
            currentMultiplier
          ).toFixed(0) +
          " $WRC)";


        /* CRASH */

        if (
          currentMultiplier >=
          crashPoint
        ) {

          finishCrash();

          return;
        }


        /* 3 MINUTE LIMIT */

        if (
          elapsed >= ROUND_TIME
        ) {

          finishRoundTimeout();

          return;
        }

      }, 50);
  }


  /* =========================================
     CRASH
  ========================================= */

  function finishCrash() {

    clearInterval(timer);

    timer = null;

    currentMultiplier =
      crashPoint;

    updateHeat(
      currentMultiplier
    );

    multEl.className =
      "multiplier crashed";

    multEl.innerText =
      crashPoint.toFixed(2) +
      "x";

    statusEl.innerText =
      "COOKED! You got burned!";

    screenEl.classList.remove(
      "running",
      "escaped"
    );

    screenEl.classList.add(
      "cooked"
    );

    playCrashSound();
    playLossSound();
    showCashOutWin(bet, true);

    addHistory(
      crashPoint,
      false
    );

    beginNextRound();
  }


  /* =========================================
     3 MINUTE TIMEOUT
  ========================================= */

  function finishRoundTimeout() {

    clearInterval(timer);

    timer = null;

    currentMultiplier =
      Math.max(
        1,
        currentMultiplier
      );

    const winAmount =
      Math.floor(
        bet *
        currentMultiplier
      );

    balance += winAmount;

    updateBalance();

    multEl.innerText =
      currentMultiplier.toFixed(2) +
      "x";

    statusEl.innerText =
      "ROUND OVER! Won " +
      winAmount.toLocaleString() +
      " $WRC";

    screenEl.classList.remove(
      "running",
      "cooked"
    );

    screenEl.classList.add(
      "escaped"
    );

    playCashoutSound();

    addHistory(
      currentMultiplier,
      true
    );

    beginNextRound();
  }


  /* =========================================
     CASH OUT
  ========================================= */

  function cashOut() {

    if (state !== "RUNNING") {
      return;
    }

    clearInterval(timer);

    timer = null;

    const winAmount =
      Math.floor(
        bet *
        currentMultiplier
      );

    const offlinePlayer = loadOfflinePlayer();
    offlinePlayer.maxMultiplier = Math.max(offlinePlayer.maxMultiplier, currentMultiplier);
    saveOfflinePlayer(offlinePlayer);
    syncPlayer(offlinePlayer);

    balance += winAmount;

    updateBalance();

    multEl.innerText =
      currentMultiplier.toFixed(2) +
      "x";

    statusEl.innerText =
      "ESCAPED! Won " +
      winAmount.toLocaleString() +
      " $WRC";

    screenEl.classList.remove(
      "running",
      "cooked"
    );

    screenEl.classList.add(
      "escaped"
    );

    playCashOutWinSound();
    showCashOutWin(winAmount);

    addHistory(
      currentMultiplier,
      true
    );

    beginNextRound();
  }


  /* =========================================
     NEXT ROUND
  ========================================= */

  function beginNextRound() {

    state = "WAITING";

    betInput.disabled = true;

    btnEl.disabled = true;

    btnEl.className =
      "btn disabled";

    btnEl.innerText =
      "NEXT ROUND...";

    roundLabelEl.innerText =
      "NEXT ROUND";

    roundRemaining =
      BETTING_TIME;

    roundTimerEl.innerText =
      BETTING_TIME;

    /*
     * Short delay so the player can
     * see the result before countdown.
     */

    setTimeout(() => {

      startBettingPhase();

    }, 1200);
  }


  /* =========================================
     BUTTON
  ========================================= */

  function handleClick() {

    ensureAudio();

    /*
     * LOCKED = 10 second countdown.
     * Do absolutely nothing.
     */

    if (state === "LOCKED") {
      return;
    }


    if (state === "BETTING") {

      startGame();

      return;
    }


    if (state === "RUNNING") {

      cashOut();

      return;
    }

  }


  /* =========================================
     INITIALIZE
  ========================================= */

  updateBalance();

  /*
   * Start with 10 second lock.
   */

  startBettingPhase();

</script>
