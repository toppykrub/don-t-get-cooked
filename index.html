<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don't Get Cooked! ($WRC)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0f1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .card {
      background: #1a1d26;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      border: 1px solid #2a2e3d;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 1.2rem;
      font-weight: 800;
      color: #ff9800;
    }
    .badge {
      background: #ff980020;
      color: #ff9800;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      border: 1px solid #ff980040;
    }
    .game-screen {
      background: #12141c;
      border-radius: 16px;
      height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid #252936;
      margin-bottom: 16px;
    }
    .multiplier {
      font-size: 3.5rem;
      font-weight: 900;
      color: #00e676;
      text-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
      transition: color 0.2s;
    }
    .multiplier.crashed {
      color: #f44336;
      text-shadow: 0 0 20px rgba(244, 67, 54, 0.3);
    }
    .status {
      font-size: 0.9rem;
      color: #8890a6;
      margin-top: 8px;
      font-weight: 600;
      text-align: center;
    }
    .history {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }
    .history::-webkit-scrollbar {
      display: none;
    }
    .pill {
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      background: #252936;
      white-space: nowrap;
    }
    .pill.win {
      color: #00e676;
    }
    .pill.loss {
      color: #f44336;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #12141c;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid #252936;
    }
    .input-row span {
      color: #8890a6;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .input-row input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      text-align: right;
      width: 100px;
      outline: none;
    }
    .input-row input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn {
      background: #00e676;
      color: #000;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn.cashout {
      background: #ff9800;
      color: #000;
    }
    .balance-box {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #252936;
      font-size: 0.85rem;
      color: #8890a6;
    }
    .balance-box strong {
      color: #fff;
    }
    @media (max-width: 400px) {
      .card {
        padding: 16px;
      }
      .multiplier {
        font-size: 3rem;
      }
      .btn {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">Don't Get Cooked!</div>
      <div class="badge">$WRC DEMO</div>
    </div>
    <div class="game-screen" id="screen">
      <div class="multiplier" id="mult">1.00x</div>
      <div class="status" id="status">
        Place your bet to start
      </div>
    </div>
    <div class="history" id="history"></div>
    <div class="controls">
      <div class="input-row">
        <span>Bet Amount ($WRC)</span>
        <input
          type="number"
          id="betInput"
          value="100"
          min="10"
          step="10"
        />
      </div>
      <button
        class="btn"
        id="actionBtn"
        onclick="handleClick()"
      >
        START GAME
      </button>
    </div>
    <div class="balance-box">
      <span>Demo Balance:</span>
      <strong id="balance">10,000 $WRC</strong>
    </div>
  </div>
  <script>
    let balance = 10000;
    let state = "IDLE";
    let currentMultiplier = 1.0;
    let crashPoint = 1.0;
    let timer = null;
    let bet = 100;
    const multEl = document.getElementById("mult");
    const statusEl = document.getElementById("status");
    const btnEl = document.getElementById("actionBtn");
    const balanceEl = document.getElementById("balance");
    const betInput = document.getElementById("betInput");
    const historyEl = document.getElementById("history");
    function updateBalance() {
      balanceEl.innerText =
        balance.toLocaleString() + " $WRC";
    }
    function addHistory(value, isWin) {
      const pill = document.createElement("div");
      pill.className =
        "pill " + (isWin ? "win" : "loss");
      pill.innerText =
        value.toFixed(2) + "x";
      historyEl.prepend(pill);
      if (historyEl.children.length > 8) {
        historyEl.removeChild(historyEl.lastChild);
      }
    }
    function resetGame() {
      state = "IDLE";
      btnEl.innerText = "START GAME";
      btnEl.className = "btn";
      betInput.disabled = false;
    }
    function handleClick() {
      /*
       * START GAME
       */
      if (state === "IDLE") {
        bet = parseInt(betInput.value, 10) || 100;
        if (bet < 10) {
          statusEl.innerText =
            "Minimum bet is 10 $WRC!";
          return;
        }
        if (bet > balance) {
          statusEl.innerText =
            "Not enough balance!";
          return;
        }
        // Deduct bet
        balance -= bet;
        updateBalance();
        state = "RUNNING";
        currentMultiplier = 1.0;
        multEl.className = "multiplier";
        statusEl.innerText =
          "Cooking... Cash out before it burns!";
        btnEl.innerText =
          "CASH OUT (" +
          (bet * currentMultiplier).toFixed(0) +
          " $WRC)";
        btnEl.className = "btn cashout";
        betInput.disabled = true;
        /*
         * Generate crash point
         */
        const rand = Math.random();
        if (rand < 0.35) {
          crashPoint =
            1.0 + Math.random() * 0.8;
        } else if (rand < 0.75) {
          crashPoint =
            1.8 + Math.random() * 2.2;
        } else {
          crashPoint =
            4.0 + Math.random() * 8.0;
        }
        const startTime = Date.now();
        /*
         * Game loop
         */
        timer = setInterval(() => {
          const elapsed =
            (Date.now() - startTime) / 1000;
          currentMultiplier =
            1.0 + Math.pow(elapsed * 0.9, 1.8);
          multEl.innerText =
            currentMultiplier.toFixed(2) + "x";
          btnEl.innerText =
            "CASH OUT (" +
            (bet * currentMultiplier).toFixed(0) +
            " $WRC)";
          /*
           * Crash
           */
          if (currentMultiplier >= crashPoint) {
            clearInterval(timer);
            timer = null;
            currentMultiplier = crashPoint;
            multEl.className =
              "multiplier crashed";
            multEl.innerText =
              crashPoint.toFixed(2) + "x";
            statusEl.innerText =
              "COOKED! You got burned.";
            addHistory(crashPoint, false);
            resetGame();
          }
        }, 50);
      }
      /*
       * CASH OUT
       */
      else if (state === "RUNNING") {
        clearInterval(timer);
        timer = null;
        const winAmount =
          Math.floor(
            bet * currentMultiplier
          );
        balance += winAmount;
        updateBalance();
        multEl.innerText =
          currentMultiplier.toFixed(2) + "x";
        statusEl.innerText =
          "ESCAPED! Won " +
          winAmount.toLocaleString() +
          " $WRC";
        addHistory(
          currentMultiplier,
          true
        );
        resetGame();
      }
    }
    // Initial balance display
    updateBalance();
  </script>
</body>
</html>
