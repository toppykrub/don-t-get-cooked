<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Get Cooked! ($WRC)</title>
    <style>
        :root {
            --bg: #0d0f12;
            --panel: #15191f;
            --green: #00ff88;
            --cyan: #00e5ff;
            --yellow: #ffd43b;
            --red: #ff3366;
            --muted: #85909b;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 25%, #12202a, var(--bg) 65%);
            color: #f3f7fa;
            font: 15px system-ui, sans-serif;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .app {
            width: min(100%, 620px);
            background: #11151bd9;
            border: 1px solid #25333c;
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 18px 70px #0009;
        }
        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .title {
            font-weight: 900;
            font-size: 1.25rem;
            color: var(--green);
            text-shadow: 0 0 18px #00ff8855;
        }
        .actions { display: flex; gap: 8px; }
        button {
            cursor: pointer;
            border: 1px solid #34434b;
            border-radius: 10px;
            padding: 10px 13px;
            color: #eafaff;
            background: #1c252c;
            font-weight: 800;
        }
        button:hover { border-color: var(--cyan); filter: brightness(1.12); }
        .connect { color: var(--cyan); }
        .sound { min-width: 44px; }
        .balance { margin: 18px 0 10px; color: var(--muted); }
        .balance b { color: white; }
        .status {
            text-align: center;
            color: var(--yellow);
            letter-spacing: .12em;
            font-weight: 900;
            padding: 10px;
        }
        .arena {
            height: 270px;
            border-radius: 16px;
            border: 1px solid #26444b;
            background: radial-gradient(ellipse at bottom, #103529, #0d1419 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .pot {
            font-size: 72px;
            filter: drop-shadow(0 0 20px #00e5ff66);
            animation: bob 1.3s ease-in-out infinite;
        }
        .mult {
            font-size: clamp(3.5rem, 14vw, 6rem);
            font-weight: 1000;
            font-variant-numeric: tabular-nums;
            color: var(--cyan);
            text-shadow: 0 0 28px currentColor;
            line-height: 1;
        }
        .mult.crash { color: var(--red); }
        @keyframes bob { 50% { transform: translateY(-9px) rotate(2deg); } }
        .sub { text-align: center; color: var(--muted); margin-top: 9px; }
        .controls { margin-top: 18px; display: grid; gap: 10px; }
        .inputrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c1115;
            border: 1px solid #26343b;
            border-radius: 11px;
            padding: 12px;
        }
        .inputrow input {
            width: 140px;
            color: white;
            background: none;
            border: 0;
            text-align: right;
            font-size: 1.05rem;
            font-weight: 800;
            outline: none;
        }
        .quick { display: flex; gap: 8px; }
        .quick button { flex: 1; padding: 9px 5px; color: var(--cyan); }
        .play { background: var(--green); color: #07130d; border: 0; font-size: 1.1rem; padding: 15px; }
        .play.cash { background: var(--yellow); }
        .play:disabled { opacity: .45; cursor: not-allowed; }
        .history { display: flex; gap: 7px; overflow: auto; margin-top: 16px; }
        .pill {
            background: #222a30;
            border-radius: 8px;
            padding: 6px 9px;
            color: var(--green);
            white-space: nowrap;
            font-size: .82rem;
        }
        .pill.bad { color: var(--red); }
        .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); }
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: none;
            place-items: center;
            padding: 16px;
            background: #000c;
        }
        .overlay.open { display: grid; }
        .modal {
            width: min(100%, 520px);
            max-height: 85vh;
            overflow: auto;
            background: #151b21;
            border: 1px solid #39464d;
            border-radius: 16px;
            padding: 20px;
        }
        .modalhead { display: flex; justify-content: space-between; align-items: center; }
        .tabs { display: flex; gap: 8px; margin: 14px 0; }
        .tabs button { flex: 1; }
        .tabs .active { border-color: var(--yellow); color: var(--yellow); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 10px 7px; border-bottom: 1px solid #293238; }
        th { color: var(--muted); font-size: .8rem; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #202b32;
            border: 1px solid var(--cyan);
            border-radius: 10px;
            padding: 12px 16px;
            display: none;
            z-index: 8;
        }
        .toast.show { display: block; }
        @media(max-width: 420px) {
            .app { padding: 16px; }
            .arena { height: 235px; }
            .quick { gap: 5px; }
            .quick button { font-size: .8rem; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header class="head">
            <div class="title">🍳 Don't Get Cooked! <span style="color:#fff">($WRC)</span></div>
            <div class="actions">
                <button class="connect" id="wallet">🔗 Connect Wallet</button>
                <button class="sound" id="sound" aria-label="Toggle sound">🔊</button>
            </div>
        </header>
        
        <div class="balance">Demo Balance: <b id="balance">10,000</b> $WRC</div>
        <div class="status" id="status">BETTING OPENS IN 10s</div>
        
        <section class="arena" id="arena">
            <div class="pot" aria-hidden="true">👨‍🍳🍲</div>
            <div class="mult" id="mult">1.00x</div>
            <div class="sub" id="sub">Place your bet before the round starts!</div>
        </section>
        
        <div class="controls">
            <label class="inputrow">
                Bet amount 
                <span><input id="bet" type="number" min="1" step="1" value="100" aria-label="Bet amount"> $WRC</span>
            </label>
            <div class="quick">
                <button data-add="100">+100</button>
                <button data-add="500">+500</button>
                <button data-add="1000">+1k</button>
                <button id="max">Max</button>
            </div>
            <button class="play" id="play">PLACE BET</button>
        </div>
        
        <div class="foot">
            <span>🎮 Demo only · no real funds</span>
            <button id="leaderBtn">🏆 Leaderboard</button>
        </div>
        
        <div class="history" id="history" aria-label="Recent rounds"></div>
    </main>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Leaderboard">
        <section class="modal">
            <div class="modalhead">
                <h2>🏆 Leaderboard</h2>
                <button id="close" aria-label="Close">✕</button>
            </div>
            <div class="tabs">
                <button class="active" data-mode="multiplier">🚀 Max Multiplier</button>
                <button data-mode="volume">🐋 Total Volume</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th id="stat">Max x</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <p class="sub" id="lbmsg"></p>
        </section>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (() => {
            'use strict';
            
            const $ = s => document.querySelector(s);
            const KEY = 'wrc-demo-v12';
            const URL = 'https://cwcgmsqvbsyfiqwersxl.supabase.co';
            const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3Y2dtc3F2YnN5Zmlxd2Vyc3hsIiwicm9sIjoiYW5vbiIsImlhdCI6MTc5MTU2Njg5MiwiZXhwIjoyMTA3MTQyODkyfQ.XSaSHjhCHGO9YyYxBgmSR6v_kndMs1fVIs1_wjknwQA';
            
            let data;
            try {
                data = JSON.parse(localStorage.getItem(KEY) || '{}');
            } catch {
                data = {};
            }
            
            let balance = Number(data.balance) || 10000;
            let volume = Number(data.volume) || 0;
            let best = Number(data.best) || 0;
            let round = 'waiting';
            let bet = 0;
            let mult = 1;
            let timer = 10;
            let muted = false;
            let audio = null;
            let crashAt = 1.35;
            let toastTimer;
            
            let db = null;
            try {
                if (window.supabase?.createClient) {
                    db = window.supabase.createClient(URL, ANON, {
                        auth: { persistSession: false },
                        global: { fetch: (...args) => fetch(...args) }
                    });
                }
            } catch (e) {
                console.warn('Supabase init failed', e);
            }
            
            function save() {
                try {
                    localStorage.setItem(KEY, JSON.stringify({ balance, volume, best }));
                } catch {}
                $('#balance').textContent = balance.toLocaleString(undefined, { maximumFractionDigits: 2 });
            }
            
            function say(s) {
                $('#toast').textContent = s;
                $('#toast').classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 2400);
            }
            
            function tone(f = 660, d = .09) {
                if (muted) return;
                try {
                    audio ??= new (window.AudioContext || window.webkitAudioContext)();
                    let o = audio.createOscillator();
                    let g = audio.createGain();
                    o.type = 'sine';
                    o.frequency.value = f;
                    g.gain.setValueAtTime(.08, audio.currentTime);
                    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + d);
                    o.connect(g);
                    g.connect(audio.destination);
                    o.start();
                    o.stop(audio.currentTime + d);
                } catch {}
            }
            
            function color(m) {
                return m < 1.5 ? '#00e5ff' : m < 2 ? '#00ff88' : m < 3 ? '#ffd43b' : '#ff3366';
            }
            
            function show() {
                let el = $('#mult');
                el.textContent = mult.toFixed(2) + 'x';
                el.style.color = color(mult);
                el.classList.toggle('crash', round === 'crashed');
                
                $('#status').textContent = 
                    round === 'waiting' ? `BETTING OPENS IN ${timer}s` :
                    round === 'betting' ? 'PLACE YOUR BET!' :
                    round === 'running' ? '🔥 GET OUT BEFORE YOU GET COOKED!' :
                    round === 'cashed' ? '💰 YOU ESCAPED!' :
                    round === 'crashed' ? '💀 COOKED!' : 'GET READY...';
                    
                $('#play').textContent = 
                    round === 'running' ? 'CASH OUT' :
                    round === 'betting' ? 'PLACE BET' :
                    round === 'waiting' ? 'WAIT...' : 'NEXT ROUND';
                    
                $('#play').className = 'play' + (round === 'running' ? ' cash' : '');
                $('#play').disabled = !(round === 'running' || round === 'betting');
                $('#bet').disabled = round !== 'betting';
                $('#sub').textContent = round === 'running' ? `Your bet: ${bet.toLocaleString()} $WRC` : 'Place your bet before the round starts!';
                $('#arena').style.animation = round === 'running' ? 'bob .24s infinite' : '';
            }
            
            function persistScore() {
                let player = 'DEMO-' + (localStorage.getItem('wrcPlayer') || (() => {
                    let x = Math.random().toString(36).slice(2, 8);
                    try { localStorage.setItem('wrcPlayer', x); } catch {}
                    return x;
                })());
                
                if (db) {
                    db.from('leaderboard').upsert({
                        wallet_address: player,
                        max_multiplier: best,
                        total_volume: volume,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'wallet_address' })
                    .then(({ error }) => error && console.warn('Score sync unavailable', error))
                    .catch(e => console.warn(e));
                }
            }
            
            function history(x, win) {
                let p = document.createElement('span');
                p.className = 'pill' + (win ? '' : ' bad');
                p.textContent = x.toFixed(2) + 'x';
                $('#history').prepend(p);
                while ($('#history').children.length > 12) {
                    $('#history').lastChild.remove();
                }
            }
            
            function startRound() {
                round = 'betting';
                timer = 10;
                mult = 1;
                show();
                
                let t = setInterval(() => {
                    if (round !== 'betting') {
                        clearInterval(t);
                        return;
                    }
                    timer--;
                    if (timer <= 0) {
                        clearInterval(t);
                        round = 'running';
                        crashAt = +(1 + Math.random() * 4).toFixed(2);
                        let start = performance.now();
                        tone(440);
                        show();
                        
                        let tick = now => {
                            if (round !== 'running') return;
                            let seconds = (now - start) / 1000;
                            mult = Math.exp(seconds * .22);
                            
                            if (mult >= crashAt) {
                                mult = crashAt;
                                round = 'crashed';
                                balance = Math.max(0, balance);
                                if (bet) history(mult, false);
                                say('COOKED! Bet lost.');
                                tone(130, .22);
                                save();
                                show();
                                setTimeout(startRound, 2400);
                                return;
                            }
                            show();
                            requestAnimationFrame(tick);
                        };
                        requestAnimationFrame(tick);
                    } else {
                        show();
                    }
                }, 1000);
            }
            
            $('#play').onclick = () => {
                tone();
                if (round === 'betting') {
                    let n = Number($('#bet').value);
                    if (!Number.isFinite(n) || n <= 0 || n > balance) {
                        say('Enter a valid bet within your demo balance.');
                        return;
                    }
                    bet = n;
                    balance -= bet;
                    volume += bet;
                    save();
                    round = 'running';
                    let start = performance.now();
                    crashAt = +(1 + Math.random() * 4).toFixed(2);
                    show();
                    
                    let tick = now => {
                        if (round !== 'running') return;
                        mult = Math.exp((now - start) / 1000 * .22);
                        if (mult >= crashAt) {
                            mult = crashAt;
                            round = 'crashed';
                            history(mult, false);
                            say('COOKED! Bet lost.');
                            tone(130, .22);
                            save();
                            show();
                            setTimeout(startRound, 2200);
                            return;
                        }
                        show();
                        requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                } else if (round === 'running') {
                    let won = bet * mult;
                    balance += won;
                    best = Math.max(best, mult);
                    history(mult, true);
                    round = 'cashed';
                    say(`Cashed out: +${won.toFixed(2)} $WRC`);
                    tone(880, .16);
                    save();
                    persistScore();
                    show();
                    setTimeout(startRound, 2200);
                }
            };
            
            document.querySelectorAll('[data-add]').forEach(b => {
                b.onclick = () => {
                    $('#bet').value = Number($('#bet').value || 0) + Number(b.dataset.add);
                    tone(720, .05);
                };
            });
            
            $('#max').onclick = () => $('#bet').value = Math.floor(balance);
            $('#wallet').onclick = () => say('Wallet connection on Base coming soon!');
            $('#sound').onclick = () => {
                muted = !muted;
                $('#sound').textContent = muted ? '🔇' : '🔊';
                $('#sound').setAttribute('aria-pressed', String(muted));
                tone();
            };
            
            async function leaderboard(mode = 'multiplier') {
                let rows = $('#rows');
                rows.innerHTML = '<tr><td colspan="3">Loading leaderboard…</td></tr>';
                $('#stat').textContent = mode === 'multiplier' ? 'Max x' : 'Volume $WRC';
                
                document.querySelectorAll('.tabs button').forEach(b => {
                    b.classList.toggle('active', b.dataset.mode === mode);
                });
                
                try {
                    if (!db) throw Error('Offline');
                    let col = mode === 'multiplier' ? 'max_multiplier' : 'total_volume';
                    let { data, error } = await db.from('leaderboard').select('wallet_address,max_multiplier,total_volume').order(col, { ascending: false }).limit(10);
                    if (error) throw error;
                    let result = (data || []).map(r => ({ name: r.wallet_address, value: Number(mode === 'multiplier' ? r.max_multiplier : r.total_volume) || 0 }));
                    $('#lbmsg').textContent = 'Live leaderboard';
                    renderRows(result, mode);
                } catch (e) {
                    console.warn('Leaderboard unavailable; showing demo data', e);
                    $('#lbmsg').textContent = 'Offline/demo fallback';
                    renderRows([
                        { name: 'SoupSurvivor', value: 12.4 },
                        { name: 'PepeChef', value: 8.75 },
                        { name: 'WokWhale', value: 5.2 },
                        { name: 'You (demo)', value: mode === 'multiplier' ? best : volume }
                    ], mode);
                }
            }
            
            function renderRows(a, mode) {
                $('#rows').innerHTML = a.map((r, i) => `
                    <tr>
                        <td>${i < 3 ? ['🥇', '🥈', '🥉'][i] : '#' + (i + 1)}</td>
                        <td>${String(r.name).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))}</td>
                        <td>${mode === 'multiplier' ? r.value.toFixed(2) + 'x' : r.value.toLocaleString()}</td>
                    </tr>
                `).join('') || '<tr><td colspan="3">No scores yet.</td></tr>';
            }
            
            $('#leaderBtn').onclick = () => { $('#overlay').classList.add('open'); leaderboard(); };
            $('#close').onclick = () => $('#overlay').classList.remove('open');
            $('#overlay').onclick = e => { if (e.target === $('#overlay')) $('#overlay').classList.remove('open'); };
            
            document.querySelectorAll('.tabs button').forEach(b => {
                b.onclick = () => leaderboard(b.dataset.mode);
            });
            
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') $('#overlay').classList.remove('open');
            });
            
            save();
            show();
            startRound();
        })();
    </script>
</body>
</html>
